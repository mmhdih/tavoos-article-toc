name: Plugin checks
on: [push, pull_request]
jobs:
  syntax-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check assets/toc.js
      - name: Release working-copy regression guards
        if: matrix.php == '8.4'
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends subversion
          fi
          python3 tools/test-publish-approved-wordpress-1.0.0.py
      - name: Build installable ZIP
        run: python3 tools/build-release.py
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: tavoos-article-toc
          path: dist/*.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
